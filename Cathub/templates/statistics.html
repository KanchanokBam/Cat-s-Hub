{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>statistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <nav class="bg-red-600 text-white px-6 py-3 flex items-center justify-between shadow-md">
        <a href="{% url 'home' %}" class="text-lg font-bold">Back to Home</a>
        <a href="{% url 'adopt' %}" class="text-lg font-semibold hover:text-yellow-300 transition mr-2">ADOPT</a>
        <a href="#" class="text-lg font-semibold hover:text-yellow-300 transition">MATCH</a>
        <a href="{% url 'statistics' %}" class="text-lg font-semibold hover:text-yellow-300 transition mr-2">Statistics</a>
        <a href="#" class="text-lg font-semibold hover:text-yellow-300 transition mr-2">TEST</a>
        <a href="{% url 'profile' %}" class="flex items-center hover:text-yellow-300 transition">
            <img src="{{ profile.get_profile_picture }}" alt="User Profile" class="w-8 h-8 rounded-full">
            <span class="ml-1 font-semibold">{{ user.username }}</span>
        </a>
    </nav>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md text-center">
        <h1 class="text-2xl font-bold mb-6">Statistics</h1>
        <p class="text-lg font-semibold">Adopted Today: {{ daily_adoption }}</p>
    </div>
</body>
</html>
