{% extends 'base.html' %}

{% block title %}Cat'sHUB{% endblock %}

{% block content %}
<!-- Heading -->
    
    
    <!-- Post Form -->
    <div class="container mx-auto mt-8">
        <h3 class="text-gray-800 font-bold mb-4 text-xl">Post Your Cat</h3>
        <form method="POST" enctype="multipart/form-data" class="space-y-4 bg-white shadow-md rounded-lg p-6">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_name" class="block text-gray-700">Name</label>
                {{ form.name }}  <!-- ตัวเลือกชื่อแมว -->
            </div>
        
            <div class="form-group">
                <label for="id_age_group" class="block text-gray-700">Age Group</label>
                {{ form.age_group }}  <!-- ตัวเลือกช่วงอายุ -->
            </div>
        
            <div class="form-group">
                <label for="id_personality" class="block text-gray-700">Personality</label>
                {{ form.personality }}  <!-- ตัวเลือกนิสัย -->
            </div>
        
            <div class="form-group">
                <label for="id_breed" class="block text-gray-700">Breed</label>
                {{ form.breed }}  <!-- ชื่อพันธุ์ -->
            </div>
        
            <div class="form-group">
                <label for="id_color" class="block text-gray-700">Color</label>
                {{ form.color }}  <!-- สีของแมว -->
            </div>
        
            <div class="form-group">
                <label for="id_image" class="block text-gray-700">Image</label>
                {{ form.image }}  <!-- ฟอร์มสำหรับอัปโหลดรูปภาพ -->
            </div>
        
            <button type="submit" class="bg-red-500 text-white font-bold px-4 py-2 rounded hover:bg-red-600">
                Post
            </button>
        </form>
               
    </div>

{% endblock %}
