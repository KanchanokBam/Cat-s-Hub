{% extends 'base.html' %}

{% block title %}Results{% endblock %}

{% block content %}
<!-- Heading -->
<div class="container mx-auto mt-10 px-6">
    <h1 class="text-3xl font-bold text-center text-red-600 mb-6">คุณราศี✨</h1>

    <!-- การ์ดแสดงราศีที่ตรงกับผู้ใช้ -->
    <div class="flex justify-center mt-6">
        <div class="relative bg-white shadow-2xl rounded-3xl p-6 w-96 transform hover:scale-105 transition duration-500 ease-in-out">
            <!-- Glow Effect -->
            <div class="absolute inset-0 bg-gradient-to-br from-purple-500 to-blue-400 opacity-20 rounded-3xl"></div>

            <!-- รูปภาพการ์ดราศีที่ทำไว้ -->
            <div class="relative">
                <img src="{{ zodiac_image }}" alt="{{ zodiac_sign }} Card" class="mx-auto w-full h-auto shadow-lg rounded-lg hover:rotate-3 transition duration-300">
            </div>
        </div>
    </div>

    <!-- Matched Cats -->
    <h2 class="text-2xl font-semibold text-center text-gray-800 mt-10">แมวที่เหมาะ 😻</h2>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 mt-6">
        {% for cat in matched_cats %}
        <a href="{% url 'cat_detail' cat.id %}" class="bg-white shadow-lg rounded-lg overflow-hidden hover:shadow-2xl transition relative group hover:scale-105 duration-300">
            <div class="relative w-full h-48">
                {% if cat.image %}
                    <img src="{{ cat.image.url }}" alt="{{ cat.name }}" class="w-full h-full object-cover">
                {% else %}
                    <img src="https://via.placeholder.com/300" alt="{{ cat.name }}" class="w-full h-full object-cover">
                {% endif %}
                <div class="absolute bottom-4 left-4 bg-black bg-opacity-50 text-white px-3 py-1 rounded-full">
                    <span class="text-sm font-medium">{{ cat.name }}</span>
                </div>
            </div>
            <div class="absolute inset-0 bg-black bg-opacity-40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                <span class="text-white font-bold text-lg">View Details</span>
            </div>
        </a>
        {% empty %}
        <p class="text-gray-500 text-lg col-span-3 text-center">ไม่มีแมวที่แมชท์.</p>
        {% endfor %}
    </div>
</div>

{% endblock %}
