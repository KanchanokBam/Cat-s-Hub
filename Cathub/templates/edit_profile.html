<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">Edit Profile</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="text-green-500 mb-4 text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <!-- Profile Picture -->
        {% if profile.get_profile_picture %}
            <div class="mb-4 text-center">
                <img src="{{ profile.get_profile_picture }}" 
                     alt="Profile Picture" class="w-24 h-24 rounded-full mx-auto shadow-lg">
            </div>
        {% else %}
            <div class="mb-4 text-center">
                <div class="w-24 h-24 rounded-full bg-gray-300 mx-auto flex items-center justify-center shadow-lg">
                    <span class="text-gray-500">No Image</span>
                </div>
            </div>
        {% endif %}

        <!-- Form -->
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}

            <!-- Username -->
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-700">New Username</label>
                <input type="text" id="id_username" name="username" 
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" 
                       placeholder="Enter new username" value="{{ form.username.value|default:'' }}">
                {% if form.username.errors %}
                    <div class="text-red-500 text-sm mt-1">{{ form.username.errors }}</div>
                {% endif %}
            </div>

            <!-- Upload Profile Picture -->
            <div>
                <label for="id_profile_picture" class="block text-sm font-medium text-gray-700">Upload Profile Picture</label>
                <input type="file" id="id_profile_picture" name="profile_picture" 
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Phone Number -->
            <div>
                <label for="id_phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
                <input type="text" id="id_phone" name="phone" 
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500"
                       placeholder="Enter phone number" value="{{ profile.phone|default:'' }}">
            </div>

            <!-- LINE ID -->
            <div>
                <label for="id_line" class="block text-sm font-medium text-gray-700">LINE ID</label>
                <input type="text" id="id_line" name="line" 
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500"
                       placeholder="Enter LINE ID" value="{{ profile.line|default:'' }}">
            </div>

            <button type="submit" 
                    class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition duration-200">
                Save Changes
            </button>
        </form>

        <a href="{% url 'profile' %}" 
           class="block text-center text-gray-500 mt-4 hover:text-blue-500 transition duration-200">
            Back to Profile
        </a>
    </div>

</body>
</html>
