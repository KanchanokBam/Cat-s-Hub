{% extends 'base.html' %}

{% block title %}Adopt Cat{% endblock %}

{% block content %}
    <!-- Main Section -->
    <div class="mt-20 flex flex-col items-center">
        <!-- Form Container -->
        <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full text-center">
            <h1 class="text-2xl font-bold text-yellow-600 mb-6">Enter your birth date</h1>
            <form method="POST" id="matchForm">
                {% csrf_token %}
                <div class="mb-4">
                    {{ form.birth_date }}
                </div>
                <button type="button" class="w-full py-2 rounded font-bold text-lg bg-red-500 text-white hover:shadow-lg hover:bg-red-600" id="submitButton">
                    SUBMIT
                </button>
            </form>
        </div>
    </div>

    <!-- Popup -->
    <div id="popup" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex justify-center items-center hidden">
        <div class="bg-white p-8 rounded-lg shadow-lg max-w-sm w-full text-center">
            <h2 class="text-2xl font-bold text-yellow-600 mb-4">Matching Your Cat...</h2>
            <p class="text-gray-700">We are finding the best match for your zodiac sign! Have a nice day!</p>
            <div class="mt-4">
                <button id="closePopup" class="py-2 px-4 bg-red-500 text-white rounded hover:bg-red-600">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('submitButton').addEventListener('click', function () {
            const popup = document.getElementById('popup');
            popup.classList.remove('hidden'); // แสดง popup

            // จำลองการโหลด และส่งฟอร์ม
            setTimeout(() => {
                document.getElementById('matchForm').submit(); // ส่งฟอร์ม
            }, 3000); // เวลาแสดง popup (3 วินาที)
        });

        document.getElementById('closePopup').addEventListener('click', function () {
            document.getElementById('popup').classList.add('hidden'); // ซ่อน popup
        });
    </script>
{% endblock %}
