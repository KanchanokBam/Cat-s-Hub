{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "จับคู่" %}{% endblock %}

{% block content %}
<!-- Main Section -->
<div class="mt-20 flex flex-col items-center">
    <!-- Form Container -->
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full text-center">
        <h1 class="text-2xl font-bold text-yellow-600 mb-6">{% trans "กรอกวันเกิด" %}</h1>
        <form method="POST" id="matchForm">
            {% csrf_token %}
            <div class="mb-4">
                {{ form.birth_date }}
            </div>
            <button type="button" class="w-full py-2 rounded font-bold text-lg bg-red-500 text-white hover:shadow-lg hover:bg-red-600 transition duration-300" id="submitButton">
                {% trans "ตกลง" %}
            </button>
        </form>
    </div>
</div>

<script>
    document.getElementById('submitButton').addEventListener('click', function () {
        const birthDate = document.querySelector('input[name="birth_date"]').value;
        if (!birthDate) {
            alert("Please enter your birth date.");
            return;
        }
        document.getElementById('matchForm').submit(); 
    });
</script>
{% endblock %}
