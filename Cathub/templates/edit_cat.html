{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ cat.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-yellow-50 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6">Edit {{ cat.name }}</h1>

        <!-- Display Current Image -->
        <div class="mb-4 text-center">
            {% if cat.image %}
                <img src="{{ cat.image.url }}" alt="{{ cat.name }}" class="w-32 h-32 rounded-lg mx-auto shadow-md">
            {% else %}
                <img src="https://via.placeholder.com/300" alt="No Image" class="w-32 h-32 rounded-lg mx-auto shadow-md">
            {% endif %}
        </div>
        

        <!-- Form -->
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="flex justify-between mt-4">
                <a href="{% url 'profile' %}" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">Save Changes</button>
            </div>
        </form>
    </div>

</body>
</html>
