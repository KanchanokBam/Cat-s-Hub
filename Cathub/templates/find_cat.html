{% extends 'base.html' %}

{% block title %}Test{% endblock %}

{% block content %}

    <!-- Main Content -->
    <div class="flex flex-col items-center justify-start mt-4">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">คัดกรองแมวกัน!</h1>
        
        <form id="catPreferenceForm" method="POST" class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
            {% csrf_token %}
            
            <!-- Step 1: Personality -->
            <div class="step" id="step1">
                <label class="text-gray-700">เลือกนิสัย:</label>
                <select name="personality" class="w-full border-gray-300 rounded-md">
                    <option value="">-- นิสัย --</option>
                    {% for personality in personalitys %}
                    <option value="{{ personality }}">{{ personality }}</option>
                    {% endfor %}
                </select>
                <button type="button" onclick="nextStep(1)" class="bg-gradient-to-r from-blue-500 to-blue-600 text-white py-2 px-6 mt-4 rounded-full shadow-lg hover:from-blue-600 hover:to-blue-700 transition-transform transform hover:scale-105">
                    Next
                </button>
            </div>

            <!-- Step 2: Age -->
            <div class="step hidden" id="step2">
                <label class="text-gray-700">เลือกช่วงอายุ:</label>
                <select name="age" class="w-full border-gray-300 rounded-md">
                    <option value="">-- ช่วงอายุ --</option>
                    <option value="kitten">Kitten </option>
                    <option value="adult">Adult </option>
                    <option value="senior">Senior </option>
                </select>
                <div class="mt-4">
                    <button type="button" onclick="prevStep(2)" class="bg-gradient-to-r from-red-500 to-red-600 text-white py-2 px-6 mt-4 rounded-full shadow-lg hover:from-red-600 hover:to-red-700 transition-transform transform hover:scale-105">
                        Back
                    </button>
                    <button type="button" onclick="nextStep(2)" class="bg-gradient-to-r from-blue-500 to-blue-600 text-white py-2 px-6 mt-4 rounded-full shadow-lg hover:from-blue-600 hover:to-blue-700 transition-transform transform hover:scale-105">
                        Next
                    </button>
                </div>
            </div>

            <!-- Step 3: Breed -->
            <div class="step hidden" id="step3">
                <label class="text-gray-700">เลือกสายพันธุ์</label>
                <select name="breed" class="w-full border-gray-300 rounded-md">
                    <option value="">สายพันธุ์</option>
                    {% for breed in breeds %}
                    <option value="{{ breed }}">{{ breed }}</option>
                    {% endfor %}
                </select>
                <div class="mt-4">
                    <button type="button" onclick="prevStep(3)" class="bg-gradient-to-r from-red-500 to-red-600 text-white py-2 px-6 mt-4 rounded-full shadow-lg hover:from-red-600 hover:to-red-700 transition-transform transform hover:scale-105">
                        Back
                    </button>
                    <button type="button" onclick="nextStep(3)" class="bg-gradient-to-r from-blue-500 to-blue-600 text-white py-2 px-6 mt-4 rounded-full shadow-lg hover:from-blue-600 hover:to-blue-700 transition-transform transform hover:scale-105">
                        Next
                    </button>
                </div>
            </div>

            <!-- Step 4: Color -->
            <div class="step hidden" id="step4">
                <label class="text-gray-700">เลือกสี</label>
                <select name="color" class="w-full border-gray-300 rounded-md">
                    <option value="">สี</option>
                    {% for color in colors %}
                    <option value="{{ color }}">{{ color }}</option>
                    {% endfor %}
                </select>
                <div class="mt-4">
                    <button type="button" onclick="prevStep(4)" class="bg-gradient-to-r from-red-500 to-red-600 text-white py-2 px-6 mt-4 rounded-full shadow-lg hover:from-red-600 hover:to-red-700 transition-transform transform hover:scale-105">
                        Back
                    </button>
                    <button type="button" onclick="nextStep(4)" class="bg-gradient-to-r from-blue-500 to-blue-600 text-white py-2 px-6 mt-4 rounded-full shadow-lg hover:from-blue-600 hover:to-blue-700 transition-transform transform hover:scale-105">
                        Next
                    </button>
                </div>
            </div>

            <!-- Step 5: Summary -->
            <div class="step hidden" id="step5">
                <div class="bg-gray-100 p-4 rounded-lg">
                    <p class="text-gray-700"><strong>นิสัย:</strong> <span id="summary-personality">-</span></p>
                    <p class="text-gray-700"><strong>ช่วงอายุ:</strong> <span id="summary-age">-</span></p>
                    <p class="text-gray-700"><strong>สายพันธุ์:</strong> <span id="summary-breed">-</span></p>
                    <p class="text-gray-700"><strong>สี:</strong> <span id="summary-color">-</span></p>
                </div>
                <div class="mt-4">
                    <button type="button" onclick="prevStep(5)" class="bg-gradient-to-r from-red-500 to-red-600 text-white py-2 px-6 mt-4 rounded-full shadow-lg hover:from-red-600 hover:to-red-700 transition-transform transform hover:scale-105">
                        Back
                    </button>
                    <button type="button" onclick="submitForm(4)" class="bg-gradient-to-r from-green-500 to-green-600 text-white py-2 px-6 mt-4 rounded-full shadow-lg hover:from-green-600 hover:to-red-700 transition-transform transform hover:scale-105">
                        Confirm
                    </button>
                </div>
            </div>
        </form>

        <div id="results" class="mt-8 w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        function nextStep(currentStep) {
    // ตรวจสอบว่ามีการตอบคำถามหรือไม่
    const stepElement = document.getElementById(`step${currentStep}`);
    const requiredInput = stepElement.querySelector('select');
    
    if (requiredInput && requiredInput.value === "") {
        Swal.fire({
            icon: 'warning',
            title: 'Incomplete Step',
            text: 'Please complete this step before proceeding to the next one.',
            confirmButtonText: 'OK',
            confirmButtonColor: '#3085d6',
        });
        return; // หยุดการทำงานถ้ายังไม่ได้กรอกข้อมูล
    }
    
    // ซ่อนขั้นตอนปัจจุบัน
    stepElement.classList.add('hidden');
    // แสดงขั้นตอนถัดไป
    document.getElementById(`step${currentStep + 1}`).classList.remove('hidden');

    if (currentStep === 4) {
        document.getElementById('summary-personality').textContent = document.querySelector('[name="personality"]').value || 'Not selected';
        document.getElementById('summary-age').textContent = document.querySelector('[name="age"]').value || 'Not selected';
        document.getElementById('summary-breed').textContent = document.querySelector('[name="breed"]').value || 'Not selected';
        document.getElementById('summary-color').textContent = document.querySelector('[name="color"]').value || 'Not selected';
    }
}


        function prevStep(currentStep) {
            document.getElementById(`step${currentStep}`).classList.add('hidden');
            document.getElementById(`step${currentStep - 1}`).classList.remove('hidden');
        }

        function submitForm() {
            const formData = new FormData(document.getElementById('catPreferenceForm'));
            fetch('/find-cat/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                },
            })
            .then(response => response.json())
            .then(data => {
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';
                if (data.cats.length === 0) {
                    resultsDiv.innerHTML = '<p class="text-center text-gray-600">No cats matched your preferences.</p>';
                } else {
                    data.cats.forEach(cat => {
                        const catCard = `
                            <a href="/cat/${cat.id}/" class="relative bg-white shadow-lg rounded-lg overflow-hidden hover:shadow-2xl transition group">
                                <!-- Cat Image -->
                                <div class="w-full h-56 bg-gray-300">
                                    <img src="${cat.image_url || 'https://via.placeholder.com/300'}" alt="${cat.name}" class="w-full h-full object-cover">
                                </div>
                                <!-- Name Overlay -->
                                <div class="absolute bottom-4 left-4 bg-black bg-opacity-50 text-white px-3 py-1 rounded-full">
                                    <span class="text-sm font-medium">${cat.name}</span>
                                </div>
                            </a>
                        `;
                        resultsDiv.innerHTML += catCard;
                    });
                }
            })
            .catch(error => {
                alert('Error submitting form: ' + error.message);
            });
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>

{% endblock %}
