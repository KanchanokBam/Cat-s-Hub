<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Cat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-[#94D2BD] via-[#0A9396] to-[#005F73] flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-lg">
        <!-- Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="text-green-500 mb-4 text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <!-- Cat Picture -->
        {% if cat.picture %}
            <div class="mb-6 text-center">
                <img src="{{ cat.picture.url }}" 
                     alt="Cat Picture" class="w-24 h-24 rounded-full mx-auto shadow-lg">
            </div>
        {% else %}
            <div class="mb-6 text-center">
                <div class="w-24 h-24 rounded-full bg-gray-300 mx-auto flex items-center justify-center shadow-lg">
                    <span class="text-gray-500">No Image</span>
                </div>
            </div>
        {% endif %}

        <!-- Form -->
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <!-- Cat Name -->
            <div>
                <label for="id_name" class="block text-sm font-medium text-[#005F73]">Cat Name</label>
                <input type="text" id="id_name" name="name" 
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-[#0A9396] focus:border-[#0A9396]" 
                       placeholder="Enter cat's name" value="{{ form.name.value|default:'' }}">
                {% if form.name.errors %}
                    <div class="text-red-500 text-sm mt-1">{{ form.name.errors }}</div>
                {% endif %}
            </div>

            <!-- Cat Breed -->
            <div>
                <label for="id_breed" class="block text-sm font-medium text-[#005F73]">Breed</label>
                <input type="text" id="id_breed" name="breed" 
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-[#0A9396] focus:border-[#0A9396]" 
                       placeholder="Enter breed" value="{{ form.breed.value|default:'' }}">
                {% if form.breed.errors %}
                    <div class="text-red-500 text-sm mt-1">{{ form.breed.errors }}</div>
                {% endif %}
            </div>

            <!-- Upload Cat Picture -->
            <div>
                <label for="id_picture" class="block text-sm font-medium text-[#005F73]">Upload Cat Picture</label>
                <input type="file" id="id_picture" name="picture" 
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-[#0A9396] focus:border-[#0A9396]">
            </div>

            <!-- Save Changes Button -->
            <button type="submit" 
                    class="w-full bg-[#0A9396] text-white py-2 rounded-lg hover:bg-[#005F73] hover:shadow-lg transition duration-200">
                Save Changes
            </button>

            <!-- Cancel Link -->
            <a href="{% url 'admin_dashboard' %}
               class="block text-center text-[#0A9396] hover:text-[#005F73] hover:underline mt-4">
                Cancel
            </a>
        </form>
    </div>
</body>
</html>
