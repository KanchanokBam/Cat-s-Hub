<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ cat.name }}'s Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-yellow-50 text-gray-800">

    <!-- Header -->
    <nav class="bg-red-600 text-white px-6 py-3 flex justify-between items-center">
        <a href="{% url 'adopt' %}" class="text-lg font-bold">Back to Adopt</a>
    </nav>

    <!-- Cat Details -->
    <div class="flex justify-center items-center mt-10">
        <div class="bg-white rounded-lg shadow-lg p-6 w-4/5 flex space-x-6">
            <!-- Image Section -->
            <div class="w-1/2">
                {% if cat.image %}
                    <img src="{{ cat.image.url }}" alt="{{ cat.name }}" class="rounded-lg w-full object-cover">
                {% else %}
                    <div class="w-full h-64 bg-gray-300 rounded-lg"></div>
                {% endif %}
            </div>

            <!-- Details Section -->
            <div class="w-1/2">
                <h2 class="text-2xl font-bold mb-2">{{ cat.name }}</h2>
                <p class="text-gray-600 mb-1"><strong>Posted by:</strong> {{ cat.user.username }}</p> <!-- แสดงชื่อผู้โพสต์ -->
                <p class="text-gray-600 mb-1"><strong>Age:</strong> {{ cat.age }}</p>
                <p class="text-gray-600 mb-1"><strong>Breed:</strong> {{ cat.breed|default:"-" }}</p>
                <p class="text-gray-600 mb-1"><strong>Color:</strong> {{ cat.color|default:"-" }}</p>
                
                <!-- Contact Button -->
                <a href="{% url 'user_profile' cat.user.username %}" 
                class="mt-8 px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition inline-block">
                Contact me
                </a>
            </div>
        </div>
    </div>

</body>
</html>
