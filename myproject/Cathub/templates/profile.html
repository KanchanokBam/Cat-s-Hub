<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-yellow-200 min-h-screen">

    <!-- Header -->
    <header class="bg-red-700 py-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <nav class="space-x-8">
                <a href="#" class="hover:text-yellow-300">ADOPT</a>
                <a href="#" class="hover:text-yellow-300">MATCH</a>
                <a href="#" class="hover:text-yellow-300">Statistics</a>
                <a href="#" class="hover:text-yellow-300">TEST</a>
            </nav>
            <div class="absolute top-4 right-4">
                <form method="POST" action="{% url 'logout' %}" id="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition" onclick="return confirmLogout();">
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </header>

    <!-- Main Profile Section -->
    <div class="container mx-auto mt-8 flex">
        <!-- Left Section: User Information -->
        <div class="w-1/3 bg-white rounded-lg shadow-md p-6 text-center">
            <img src="https://via.placeholder.com/150" alt="User Photo" class="rounded-full w-32 h-32 mx-auto mb-4">
            <p><span class="font-semibold text-gray-700">Email:</span> {{ user.email }}</p>
            <p><span class="font-semibold text-gray-700">Username:</span> {{ user.username }}</p>

            <!-- Buttons -->
            <button class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-2 rounded mb-2">
                Edit Profile
            </button>
            <button class="w-full border-2 border-yellow-500 text-yellow-500 font-bold py-2 rounded hover:bg-yellow-500 hover:text-black transition">
                Patronage Request
            </button>
        </div>

        <!-- Right Section: Post Form -->
        <div class="w-2/3 bg-white rounded-lg shadow-md p-6 ml-6">
            <h3 class="text-gray-800 font-bold mb-4 text-xl">POST</h3>
            <form action="#" method="POST" class="space-y-4">
                <input type="text" placeholder="Name" class="w-full border-2 border-red-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400">
                <input type="text" placeholder="Age" class="w-full border-2 border-red-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400">
                <input type="text" placeholder="Breed" class="w-full border-2 border-red-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400">
                <input type="text" placeholder="Color" class="w-full border-2 border-red-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400">

                <!-- Upload Section -->
                <div class="w-full flex items-center justify-center border-2 border-red-300 border-dashed rounded h-32">
                    <span class="text-gray-500 text-sm">+</span>
                </div>

                <button type="submit" class="bg-red-500 text-white font-bold px-4 py-2 rounded hover:bg-red-600">
                    Post
                </button>
            </form>
        </div>
    </div>
</body>
</html>
