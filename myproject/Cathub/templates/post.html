<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Cat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-yellow-50 text-gray-800">

    <!-- Header -->
    <nav class="bg-red-600 text-white px-6 py-3 flex justify-between items-center">
        <a href="{% url 'home' %}" class="text-lg font-bold">Back to Home</a>
        <a href="{% url 'profile' %}" class="flex items-center hover:text-yellow-300 transition">
            <img src="{{ profile.get_profile_picture }}" alt="User Profile" class="w-8 h-8 rounded-full">
            <span class="ml-1 font-semibold">{{ user.username }}</span>
        </a>
    </nav>
    

    <!-- Post Form -->
    <div class="container mx-auto mt-8">
        <h3 class="text-gray-800 font-bold mb-4 text-xl">Post Your Cat</h3>
        <form method="POST" enctype="multipart/form-data" class="space-y-4 bg-white shadow-md rounded-lg p-6">
            {% csrf_token %}
            {{ form.as_p }}

           

            <button type="submit" class="bg-red-500 text-white font-bold px-4 py-2 rounded hover:bg-red-600">
                Post
            </button>
        </form>
    </div>

</body>
</html>
