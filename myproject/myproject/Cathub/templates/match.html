<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-yellow-50 min-h-screen">

    <nav class="bg-red-600 text-white px-6 py-3 flex items-center justify-between shadow-md">
        <nav class="bg-red-600 text-white px-6 py-3 flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-lg font-bold">Back to Home</a>
        </nav>
        <!-- Left Menu -->
        <a href="#" class="text-lg font-semibold hover:text-yellow-300 transition mr-2">ADOPT</a>
        <a href="#" class="text-lg font-semibold hover:text-yellow-300 transition">MATCH</a>
        <!-- Right Menu -->
        <a href="#" class="text-lg font-semibold hover:text-yellow-300 transition mr-2">Statistics</a>
        <a href="#" class="text-lg font-semibold hover:text-yellow-300 transition mr-2">TEST</a>
        <!-- Profile Section -->
        <a href="{% url 'profile' %}" class="flex items-center hover:text-yellow-300 transition">
            <img src="https://via.placeholder.com/30" alt="User Profile" class="w-8 h-8 rounded-full">
            <span class="ml-1 font-semibold">{{ user.username }}</span>
        </a>
    </nav>

    <!-- Form Section -->
    <div class="flex justify-center items-center mt-10">
        <div class="bg-white rounded-lg shadow-lg p-8 w-3/4 max-w-lg">
            <h2 class="text-2xl font-bold text-yellow-600 mb-4 text-center">Enter your birth date</h2>

            <!-- ฟอร์มวันเดือนปีเกิด -->
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div class="grid grid-cols-3 gap-4">
                    {{ form.day }}
                    {{ form.month }}
                    {{ form.year }}
                </div>
                <div class="text-center mt-4">
                    <button type="submit" class="bg-red-500 text-white font-bold px-4 py-2 rounded-lg hover:bg-red-600">
                        Submit
                    </button>
                </div>
            </form>

            <!-- แสดงข้อความ Success -->
            {% if messages %}
                <div class="mt-4 text-center">
                    {% for message in messages %}
                        <p class="text-green-500">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        </div>
    </div>

</body>
</html>
